<div class="d-flex justify-content-between mb-3">
  <h4>Available Rides</h4>
  <div>
    <label class="me-2">Filter by vehicle:</label>
    <select (change)="onFilterChange($any($event.target).value || undefined)" class="form-select d-inline-block"
      style="width:150px;">
      <option value="">All</option>
      <option value="Car">Car</option>
      <option value="Bike">Bike</option>
    </select>
  </div>
</div>

<div *ngIf="filtered.length === 0" class="alert alert-info">No matching rides in ±60 minutes for today.</div>

<div *ngFor="let r of filtered" class="card mb-2">
  <div class="card-body d-flex justify-content-between align-items-center">
    <div>
      <div><strong>{{ r.ownerEmployeeId }}</strong> — {{ r.vehicleType }} ({{r.vehicleNo}})</div>
      <div class="small text-muted">{{ r.pickupPoint }} → {{ r.destination }} | {{ r.timeISO | date:'shortTime' }}</div>
      <div class="small">Vacant Seats: <strong>{{ r.vacantSeats }}</strong></div>
    </div>
    <div>
      <button [disabled]="r.vacantSeats<=0" class="btn btn-sm btn-outline-primary"
        (click)="goToBook(r.id)">Book</button>
    </div>
  </div>
</div>
